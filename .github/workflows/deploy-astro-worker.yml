name: Deploy Astro Worker (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major version
        type: string
        default: '22'
      build-command:
        description: npm script to run for build
        type: string
        default: 'build'
      working-directory:
        description: |
          Subdirectory of the repo that contains package.json + the wrangler config.
          Defaults to '.' (repo root). Set to e.g. 'web' or 'guides/web' for monorepos
          where the Astro consumer lives in a subdirectory.
        type: string
        default: '.'
      validate-command:
        description: |
          Optional npm script to run between `npm ci` and the build, as a
          schema/contract gate. Empty (default) skips it. Set to e.g. 'validate'
          for academic books using `book-scaffold validate` so a broken cite key
          or duplicate anchor ID fails CI before the build runs.
        type: string
        default: ''
      apt-packages:
        description: |
          Space-separated list of apt packages to install before `npm ci`.
          Empty (default) skips the install step entirely. Example:
          "pandoc texlive-base texlive-latex-extra pdf2svg" for builds that
          need pandoc + LaTeX (dlai-study-notes pattern).
        type: string
        default: ''
      enable-pr-previews:
        description: |
          When true, adds a pull_request job that uploads a Wrangler version
          (not deploy) and posts a PR comment with the preview URL. The caller
          MUST declare a `pull_request:` trigger AND grant `pull-requests: write`
          permission. Defaults to false (production-only, matches solo
          commit-to-main flow).
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  deployments: write
  pull-requests: write   # enable-pr-previews: the "Comment preview URL on PR" step posts via issues.createComment

jobs:
  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - if: inputs.apt-packages != ''
        name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - if: inputs.validate-command != ''
        run: npm run ${{ inputs.validate-command }}

      - run: npm run ${{ inputs.build-command }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: deploy

  deploy-preview:
    if: github.event_name == 'pull_request' && inputs.enable-pr-previews
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - if: inputs.apt-packages != ''
        name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - if: inputs.validate-command != ''
        run: npm run ${{ inputs.validate-command }}

      - run: npm run ${{ inputs.build-command }}

      - id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: versions upload

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.upload.outputs.deployment-url }}';
            if (!url) {
              core.setFailed('wrangler-action did not return a deployment-url');
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deploy: ${url}`,
            });
